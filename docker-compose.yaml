
services:
  postgres:
    image: postgres:17
    container_name: irontrack-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: irontrack
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: irontrack

    ports:
      - "5432:5432"

    volumes:
      - irontrack_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irontrack -d irontrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  irontrack_data:
